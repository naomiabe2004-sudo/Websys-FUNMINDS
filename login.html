<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FunMinds</title>

    <link rel="stylesheet" href="css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<section class="login-page">

    <!-- LEFT SIDE -->
    <div class="login-left">

        <div class="logo-section">
            <div class="logo-wireframe">
                <img src="logo.jpg" alt="Logo">
            </div>
            <h1>FunMinds</h1>
        </div>

        <div class="login-text">
            <p>
                Start your reading journey with our interactive platform simple,
                engaging activities that build reading and comprehension skills.
            </p>
        </div>

        <div class="kids-wireframe">
            <img src="kids.png" alt="Kids Illustration">
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">

        <p class="techkeep">TechKeep</p>

        <div class="profile-wireframe">
            <img src="profileholder.png" alt="Profile Placeholder">
        </div>

        <!-- LOGIN FORM ONLY -->
        <form id="loginForm" class="login-form">

            <h2>Login</h2>

            <input type="text" id="li_username" placeholder="Username" required>

            <input type="password" id="li_password" placeholder="Password" required>

            <button type="submit">Login</button>

            <p class="form-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>

        </form>

    </div>

</section>

<script src="js/script.js"></script>

</body>
</html>
